<thead>
  <tr>
    <th scope="col">Date</th>
    <th scope="col">Source</th>
    <th scope="col">By</th>
    <th scope="col">Note</th>
  </tr>
</thead>
<tbody>
  {% for row in rows %}
    <tr>
      <td class="nowrap">{{ row.entry.occurred_on|date:"j M Y" }}</td>
      <td>{{ row.source_label }}</td>
      <td>{{ row.author_label }}</td>
      <td class="note-cell">
        {% if row.show_note %}{{ row.note|linebreaksbr }}
        {% elif row.has_hidden_note %}<span class="muted small">Note not shared with you</span>
        {% else %}<span class="muted">—</span>{% endif %}
      </td>
    </tr>
  {% endfor %}
</tbody>
